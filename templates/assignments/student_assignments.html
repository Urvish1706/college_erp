{% extends "base.html" %}

{% block title %}My Assignments | College ERP{% endblock %}

{% block content %}
<div class="container-fluid p-0">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 fw-bold m-0"><i class="fa-solid fa-file-lines text-primary me-2"></i>My Course Assignments</h1>
            <p class="text-muted small m-0">Track and submit course assignments for your enrolled semester.</p>
        </div>
    </div>

    <div class="card border-0 shadow-sm rounded-4 p-4" style="background: var(--card);">
        <div class="text-center py-5 text-muted">
            <i class="fa-solid fa-file-circle-check fs-1 text-primary mb-3"></i>
            <h3 class="h5 fw-bold text-body">Assignments Portal</h3>
            <p class="small text-muted mb-0">No active assignment submissions pending for your current semester.</p>
        </div>
    </div>
</div>
{% endblock %}
