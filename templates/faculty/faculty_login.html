<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Faculty Login | College ERP</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #080d1d;
            color: #ffffff;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-wrapper {
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        .login-card {
            background: #111827;
            border: 1px solid #263247;
            border-radius: 24px;
            padding: 38px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, .45);

            animation: slideUp .5s ease;
        }

        @keyframes slideUp {

            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        .logo {
            width: 70px;
            height: 70px;

            margin: 0 auto 20px;

            border-radius: 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: linear-gradient(
                135deg,
                #4f46e5,
                #7c3aed
            );

            font-size: 28px;

            box-shadow:
                0 12px 30px rgba(79, 70, 229, .35);
        }

        .title {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 30px;
        }

        .form-label {
            color: #cbd5e1;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .form-control {
            height: 50px;
            background: #0b1220;
            border: 1px solid #334155;
            color: white;
            border-radius: 12px;
            padding-left: 15px;
        }

        .form-control:focus {
            background: #0b1220;
            color: white;
            border-color: #6366f1;

            box-shadow:
                0 0 0 3px rgba(99, 102, 241, .15);
        }

        .form-control::placeholder {
            color: #64748b;
        }

        .input-group-custom {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 16px;
            color: #6366f1;
            z-index: 5;
        }

        .input-group-custom .form-control {
            padding-left: 45px;
        }

        .login-btn {
            width: 100%;
            height: 52px;

            border: none;
            border-radius: 12px;

            background: linear-gradient(
                135deg,
                #4f46e5,
                #7c3aed
            );

            color: white;
            font-size: 14px;
            font-weight: 800;

            transition: .25s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 12px 25px rgba(79, 70, 229, .35);
        }

        .alert {
            border-radius: 12px;
            font-size: 13px;
            border: none;
        }

        .login-footer {
            text-align: center;
            margin-top: 25px;
            color: #64748b;
            font-size: 11px;
        }

        .login-footer span {
            color: #6366f1;
            font-weight: 700;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;

            color: #94a3b8;
            text-decoration: none;

            font-size: 12px;
        }

        .back-link:hover {
            color: #818cf8;
        }

    </style>

</head>

<body>

<div class="login-wrapper">

    <div class="login-card">

        <!-- LOGO -->

        <div class="logo">
            <i class="fa-solid fa-chalkboard-user"></i>
        </div>


        <!-- TITLE -->

        <div class="title">
            Faculty Login
        </div>

        <div class="subtitle">
            Sign in to access your College ERP faculty dashboard.
        </div>


        <!-- MESSAGES -->

        {% if messages %}

            {% for message in messages %}

                <div class="alert alert-danger mb-3">

                    <i class="fa-solid fa-circle-exclamation me-2"></i>

                    {{ message }}

                </div>

            {% endfor %}

        {% endif %}


        <!-- LOGIN FORM -->

        <form method="POST">

            {% csrf_token %}


            <!-- USERNAME -->

            <div class="mb-3">

                <label class="form-label">
                    Username
                </label>

                <div class="input-group-custom">

                    <i class="fa-solid fa-user input-icon"></i>

                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="mb-4">

                <label class="form-label">
                    Password
                </label>

                <div class="input-group-custom">

                    <i class="fa-solid fa-lock input-icon"></i>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>

            </div>


            <!-- LOGIN -->

            <button
                type="submit"
                class="login-btn"
            >

                <i class="fa-solid fa-right-to-bracket me-2"></i>

                Login as Faculty

            </button>

        </form>


        <!-- BACK -->

        <a
            href="/"
            class="back-link"
        >

            <i class="fa-solid fa-arrow-left me-1"></i>

            Back to College ERP

        </a>


        <div class="login-footer">

            College ERP &nbsp;•&nbsp;
            <span>Faculty Portal</span>

        </div>

    </div>

</div>

</body>
</html>
