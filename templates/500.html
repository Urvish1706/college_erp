{% extends "base.html" %}

{% block title %}Server Error (500) | College ERP{% endblock %}

{% block content %}
<div class="container text-center py-5" style="max-width: 600px;">
    <div class="card border-0 shadow-sm rounded-4 p-5" style="background: var(--surface);">
        <div class="text-warning mb-3"><i class="fa-solid fa-server fa-4x"></i></div>
        <h1 class="h2 fw-bold mb-2">500 - Server Error</h1>
        <p class="text-muted mb-4">An unexpected system error occurred. Our administrative team has been alerted.</p>
        <a href="{% url 'dashboard' %}" class="btn btn-primary rounded-3 px-4">
            <i class="fa-solid fa-house me-1"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
