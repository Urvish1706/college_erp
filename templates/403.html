{% extends "base.html" %}

{% block title %}Access Denied (403) | College ERP{% endblock %}

{% block content %}
<div class="container text-center py-5" style="max-width: 600px;">
    <div class="card border-0 shadow-sm rounded-4 p-5" style="background: var(--surface);">
        <div class="text-danger mb-3"><i class="fa-solid fa-user-lock fa-4x"></i></div>
        <h1 class="h2 fw-bold mb-2">403 - Permission Denied</h1>
        <p class="text-muted mb-4">You do not have authorization to view or access this institutional resource.</p>
        <a href="{% url 'dashboard' %}" class="btn btn-primary rounded-3 px-4">
            <i class="fa-solid fa-house me-1"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
