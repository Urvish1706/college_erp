{% extends "base.html" %}

{% block title %}Password Reset Complete | College ERP{% endblock %}

{% block content %}
<div class="container-fluid p-0 d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="card border-0 shadow-sm rounded-4 p-4 text-center" style="background: var(--surface); max-width: 480px; width: 100%;">
        <div class="mb-3">
            <i class="fa-solid fa-circle-check fa-3x text-success"></i>
        </div>
        <h4 class="fw-bold mb-2">Password Reset Successful!</h4>
        <p class="text-muted small mb-4">Your password has been set. You may now log in with your new credentials.</p>

        <a href="{% url 'login' %}" class="btn btn-primary w-100 py-2 shadow-sm fw-semibold">
            Log In Now
        </a>
    </div>
</div>
{% endblock %}
