{% extends "base.html" %}

{% block title %}Password Reset Complete | College ERP{% endblock %}

{% block auth_content %}

<style>
    .login-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
        background: linear-gradient(135deg, #111827, #312e81, #4f46e5);
    }

    .shape {
        position: absolute;
        border-radius: 50%;
        filter: blur(2px);
        opacity: .35;
        animation: float 7s ease-in-out infinite;
    }

    .shape-one {
        width: 250px;
        height: 250px;
        background: #8b5cf6;
        top: -80px;
        left: -60px;
    }

    .shape-two {
        width: 350px;
        height: 350px;
        background: #06b6d4;
        bottom: -120px;
        right: -100px;
        animation-delay: 2s;
    }

    @keyframes float {
        0%,100% { transform: translateY(0); }
        50% { transform: translateY(-25px); }
    }

    .login-card {
        width: 440px;
        max-width: calc(100% - 30px);
        padding: 38px;
        border-radius: 28px;
        background: rgba(255,255,255,.12);
        border: 1px solid rgba(255,255,255,.2);
        backdrop-filter: blur(20px);
        box-shadow: 0 30px 80px rgba(0,0,0,.3);
        color: white;
        z-index: 2;
    }

    .brand-icon {
        width: 70px;
        height: 70px;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: auto;
        background: linear-gradient(135deg, #10b981, #059669);
        font-size: 30px;
        box-shadow: 0 15px 35px rgba(0,0,0,.25);
    }

    .login-btn {
        height: 52px;
        border: none;
        border-radius: 14px;
        width: 100%;
        font-weight: 700;
        background: linear-gradient(135deg, #818cf8, #7c3aed);
        color: white;
        transition: .3s;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
    }

    .login-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 30px rgba(124,58,237,.4);
        color: white;
    }
</style>

<div class="login-page">
    <div class="shape shape-one"></div>
    <div class="shape shape-two"></div>

    <div class="login-card text-center" data-aos="zoom-in">
        <div class="brand-icon mb-3">
            <i class="fa-solid fa-circle-check"></i>
        </div>

        <h2 class="fw-bold mb-2">Password Reset Successful</h2>

        <p class="text-white-50 small mb-4">
            Your password has been reset successfully. You may now log in with your new password.
        </p>

        <a href="{% url 'login' %}" class="login-btn">
            <i class="fa-solid fa-right-to-bracket me-2"></i> Login Now
        </a>
    </div>
</div>

{% endblock %}
